# Alembic configuration (M1-02).
# script_location points to this directory (env.py / script.py.mako / versions/).
# The default database URL is resolved by env.py relative to the repository root
# as runtime_data/psit.db (spec section 11.3); the PSIT_DB_URL environment
# variable overrides it. config/local.toml overrides belong to M3-02.
[alembic]
script_location = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
