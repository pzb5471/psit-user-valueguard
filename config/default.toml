# 非敏感运行默认值（ADR 0047、0082、0083；技术实施规格 3.2 Task 默认值）。
# 成员本机覆盖写入不入 Git 的可选 config/local.toml，覆盖粒度为表内单项。
# 配置项缺失、类型错误或超出范围时启动立即失败，不静默更换目录或端口。
# 智谱密钥只从 ZAI_API_KEY 环境变量读取，不允许出现在任何 TOML 文件中。

[http]
host = "127.0.0.1"
port = 8000

[frontend]
dev_port = 5173

[storage]
# 相对值按项目根目录解析（ADR 0082），不允许 UNC 网络路径。
runtime_dir = "runtime_data"

[analysis]
# GLM 连接与响应上限（规格 3.2）；最终值由 M2-10 PoC 冻结。
connect_timeout_seconds = 10
response_timeout_seconds = 300
max_tokens = 4096

[retry]
max_attempts = 3

[executor]
# 案例并发，规格 3.2 允许 1—3，最终值由 PoC 决定。
case_concurrency = 2

[polling]
# 活动批次轮询间隔（秒）。
active_batch_interval_seconds = 2

[logging]
level = "INFO"
