[project]
name = "psit-user-valueguard"
version = "0.1.0"
description = "PSIT MVP：高价值客户异常售后决策支持（单机本地工作台）"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
    "zai-sdk",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-m 'not live_glm'"
markers = [
    "live_glm: 真实 GLM 调用验证（M2-10 专用，不进入普通 PR 门槛）",
    "task_m2_01: M2-01 分析合同与动作目录测试",
    "task_m2_02: M2-02 提示词资产测试",
    "task_m2_03: M2-03 模型客户端测试",
    "task_m2_04: M2-04 结果校验测试",
    "task_m2_05: M2-05 感知阶段测试",
    "task_m2_06: M2-06 归因阶段测试",
    "task_m2_07: M2-07 策略阶段测试",
    "task_m2_08: M2-08 分析引擎测试",
    "task_m2_09: M2-09 模块验收测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["backend", "tests"]
extraPaths = ["backend", "tests/m2/engine"]
